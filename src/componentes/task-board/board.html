<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To‑do</title>

  <!-- Bootstrap CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Seus estilos extras -->
  <link rel="stylesheet" href="board.css" />
</head>

<body class="bg-light py-4">

 <!-- Task Line Template -->
<template id="task-template">
  <div class="linha-task card mb-3"  draggable="true">
    <div class="task card-body d-flex flex-wrap align-items-center gap-3 justify-content-between">
      <div class="d-flex align-items-center gap-2 flex-grow-1 checkbox-highlight">

        <!-- Checkbox destacado -->
        <input type="checkbox" class="checkb form-check-input" />

        <!-- Exclamação de atraso (fica oculta por padrão) -->
        <span class="atraso-alert d-none"></span>
        <!-- Conteúdo da task -->
        <div class="conteudo-task">
          <p class="texto-task mb-1 fw-semibold">Nova tarefa...</p>
          <p class="descricao-task mb-0 text-muted">Descrição da tarefa...</p>
        </div>
      </div>
      <!-- Ações à direita -->
      <div class="d-flex align-items-center gap-1">
        <div class="priority-container position-relative" style="min-width: 120px;">
          <button type="button" class="btn btn-outline-secondary w-100 set-priority" data-element-type="trigger">
            <i class="bi bi-flag me-1"></i> Prioridade
          </button>
          <select class="prioridade form-select d-none" data-element-type="input">
            <option value="">Prioridade</option>
            <option value="baixa">🏁 Baixa</option>
            <option value="media">🏴 Média</option>
            <option value="alta">🚩 Alta</option>
          </select>
        </div>
        <div class="due-date-container position-relative" style="min-width: 120px;">
          <button type="button" class="btn btn-outline-secondary w-100 set-due-date" data-element-type="trigger">
            <i class="bi bi-calendar-event me-1"></i> Data
          </button>
          <input type="date" class="due-date form-control d-none" data-element-type="input" />
        </div>
        <button class="btnmenu btn btn-light p-1" title="Menu">
          <i class="bi bi-three-dots-vertical"></i>
        </button>
        <button class="excluir btn btn-outline-danger" title="Excluir">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </div>
</template>


  <!-- Taskboard Template -->
  <template id="taskboard-template">
  <div class="taskboard container my-4">
    <!-- Navegação -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-secondary nav-day-btn btn-nav-prev" type="button">Anteriores</button>
        <button class="btn btn-outline-secondary nav-day-btn btn-nav-today active" type="button">Hoje</button>
        <button class="btn btn-outline-secondary nav-day-btn btn-nav-next" type="button">Próximas</button>
        <button class="btn btn-outline-secondary nav-day-btn btn-nav-nodate" type="button">Sem Data</button>
      </div>
      <button class="btn btn-sm btn-outline-primary btn-toggle-completed">
        Ocultar tarefas concluídas
      </button>
    </div>
    <div class="row day-columns"></div>
    <div class="footer-add-task-area mt-4">
      <button class="btn btn-primary w-100 btn-add-root-task">
        <i class="bi bi-plus-lg me-1"></i> Nova tarefa principal
      </button>
    </div>
  </div>
</template>

    <!-- Container de tarefas -->
  <div class="container" id="container-tasks">
    <!-- Tarefas serão inseridas dinamicamente -->
  </div>

  <!-- Bootstrap JS + seu script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="create-task-board.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
  const tasksContainer = document.getElementById('container-tasks');

  // Datas utilitárias
  const today = new Date();
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  const tomo = new Date(today); tomo.setDate(tomo.getDate()+1);
  const afterTomo = new Date(today); afterTomo.setDate(afterTomo.getDate()+2);

  // Exemplos: uma atrasada, uma de hoje, uma próxima, uma sem data, uma root com duas subtasks
  const initialTasks = [
    { title: "Task atrasada urgente", priority: "alta", dueDate: ymd(yest), id: 2 },
    { title: "Task de hoje", priority: "baixa", dueDate: ymd(today), id: 4 },
    { title: "Task próxima", priority: "alta", dueDate: ymd(tomo), id: 5 },
    { title: "Task futura", priority: "media", dueDate: ymd(afterTomo), id: 6},
    { title: "Task sem data, alta", priority: "alta", id: 7 },
    { title: "Task sem data, baixa", priority: "baixa", id: 8 },
    // Task root com subtasks:
    { title: "Task com subtasks", priority: "media", dueDate: ymd(today), id: 1 },
    { title: "Subtask 1", priority: "alta", parentTaskId: 1, id: 9},
    { title: "Subtask 2", priority: "baixa", parentTaskId: 1, id: 10 },

    { title: "Task atrasada média", priority: "media", dueDate: ymd(yest), id: 3},
    { title: "Subtask 3", priority: "baixa", parentTaskId: 3, id: 11 },
  ];

  // Inicializa board
  const [board, tasks, taskBoard] = createTaskBoard(document, document, {
    initialTasks,
    onCreateTask: t => console.log('Nova tarefa:', t),
    onDeleteTask: t => console.log('Deletada:', t),
    onUpdateTask: t => console.log('Atualizada:', t),
  });

  tasksContainer.appendChild(board);

});

  </script>


</body>
</html>
